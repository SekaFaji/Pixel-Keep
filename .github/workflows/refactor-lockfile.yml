name: One-time refactor lockfile generation

on:
  push:
    branches:
      - refactor/sek-arrows-upgrades-ui-quality-20261030

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: "!contains(github.event.head_commit.message, 'chore(lockfile)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate npm dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this refactor branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(lockfile): pin resolved npm dependency tree"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
